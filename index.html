<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Repulsor.pro">
    <title>Repulsor.pro</title>
    
    <!-- Шахмат логикасы жана тактасы -->
    <link rel="stylesheet" href="https://unpkg.com">
    <script src="https://jquery.com"></script>
    <script src="https://cloudflare.com"></script>
    <script src="https://unpkg.com"></script>

    <style>
        :root {
            --bg-color: #0d1117;
            --island-bg: #161b22;
            --accent: #58a6ff;
            --text: #f0f6fc;
            --border: rgba(255, 255, 255, 0.12);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-top: env(safe-area-inset-top, 20px);
            overflow-x: hidden;
        }

        /* Үстүнкү Dynamic Island стилиндеги панель */
        .top-island-wrapper {
            position: fixed;
            top: max(10px, env(safe-area-inset-top));
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            width: 92%;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .island-pill {
            background: rgba(15, 19, 26, 0.92);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            min-width: 200px;
        }

        .island-pill.expanded {
            width: 100%;
            border-radius: 22px;
            flex-direction: column;
            align-items: stretch;
            padding: 14px 16px;
        }

        .island-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            font-size: 14px;
            letter-spacing: 0.2px;
        }

        .knight-icon {
            width: 18px;
            height: 18px;
            fill: #ffffff;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background-color: #ffffff;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 8px #58a6ff;
        }

        .chevron {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s ease;
        }

        .island-pill.expanded .chevron {
            transform: rotate(180deg);
        }

        /* Ачылуучу менюнун ичи */
        .island-content {
            display: none;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid var(--border);
            flex-direction: column;
            gap: 10px;
        }

        .island-pill.expanded .island-content {
            display: flex;
        }

        .eval-row {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: #8b949e;
        }

        .eval-val {
            color: #58a6ff;
            font-weight: 700;
            font-family: monospace;
        }

        .best-move-box {
            background: rgba(88, 166, 255, 0.12);
            border: 1px solid rgba(88, 166, 255, 0.3);
            border-radius: 12px;
            padding: 8px 12px;
            font-size: 13px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Шахмат тактасы */
        .main-container {
            margin-top: 75px;
            width: 100%;
            max-width: 420px;
            padding: 0 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        #board {
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
        }

        /* Башкаруу баскычтары */
        .controls {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            width: 100%;
        }

        button {
            background: var(--island-bg);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 12px 8px;
            border-radius: 14px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:active {
            background: #21262d;
            transform: scale(0.98);
        }

        button.primary {
            background: #1f6feb;
            border-color: #388bfd;
        }

        .status-bar {
            width: 100%;
            background: var(--island-bg);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 12px 16px;
            font-size: 13px;
            color: #c9d1d9;
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body>

    <!-- Сүрөттөгүдөй үстүнкү панель -->
    <div class="top-island-wrapper">
        <div class="island-pill" id="islandPill" onclick="toggleIsland()">
            <div class="island-header">
                <div class="brand">
                    <!-- Шахмат атынын сүрөтчөсү -->
                    <svg class="knight-icon" viewBox="0 0 24 24">
                        <path d="M19 22H5v-2h14v2M17.16 8.26A4.96 4.96 0 0 0 15 5.17V3h-2v1.34c-.63-.21-1.3-.34-2-.34-3.31 0-6 2.69-6 6 0 1.95.94 3.68 2.39 4.77L6 18h12l-1.39-3.23c.86-.65 1.52-1.56 1.85-2.61.34-1.08.23-2.25-.3-3.9z"/>
                    </svg>
                    <span class="status-dot"></span>
                    <span>Repulsor.pro</span>
                </div>
                <div class="chevron">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="6 9 12 15 18 9"></polyline>
                    </svg>
                </div>
            </div>

            <div class="island-content" onclick="event.stopPropagation()">
                <div class="eval-row">
                    <span>Кыймылдаткыч (Engine):</span>
                    <span class="eval-val" id="engineStatus">Даяр</span>
                </div>
                <div class="eval-row">
                    <span>Баалоо (Eval):</span>
                    <span class="eval-val" id="evalScore">0.00</span>
                </div>
                <div class="best-move-box">
                    <span>Мыкты жүрүш:</span>
                    <strong id="bestMove" style="color: #58a6ff;">e2 → e4</strong>
                </div>
            </div>
        </div>
    </div>

    <div class="main-container">
        <div id="board"></div>

        <div class="status-bar">
            <span id="gameStatus">Актардын жүрүшү</span>
            <span id="moveCount">Жүрүш: 1</span>
        </div>

        <div class="controls">
            <button onclick="undoMove()">↩ Артка</button>
            <button onclick="flipBoard()">⇅ Айлантуу</button>
            <button class="primary" onclick="resetGame()">↻ Жаңы оюн</button>
        </div>
    </div>

    <script>
        var board = null;
        var game = new Chess();

        function toggleIsland() {
            document.getElementById('islandPill').classList.toggle('expanded');
        }

        function onDragStart(source, piece) {
            if (game.game_over()) return false;
            if ((game.turn() === 'w' && piece.search(/^b/) !== -1) ||
                (game.turn() === 'b' && piece.search(/^w/) !== -1)) {
                return false;
            }
        }

        function onDrop(source, target) {
            var move = game.move({
                from: source,
                to: target,
                promotion: 'q'
            });

            if (move === null) return 'snapback';
            updateStatus();
            analyzePosition();
        }

        function onSnapEnd() {
            board.position(game.fen());
        }

        function updateStatus() {
            var status = '';
            var moveColor = game.turn() === 'w' ? 'Актардын жүрүшү' : 'Каралардын жүрүшү';

            if (game.in_checkmate()) {
                status = 'Мат! ' + (game.turn() === 'w' ? 'Каралар утту' : 'Актар утту');
